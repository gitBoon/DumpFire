<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="DumpFire — Blazingly fast local Kanban board. No cloud, no latency, just raw speed." />
		<meta name="theme-color" content="#f5f5f9" />
		<script nonce="%sveltekit.nonce%">
			// Prevent flash of wrong theme
			(function() {
				const t = localStorage.getItem('dumpfire-theme');
				if (t) document.documentElement.setAttribute('data-theme', t);
			})();
		</script>
		<title>DumpFire — Kanban</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
